name: fleetctl-gitops-rc
description: Builds fleetctl gitops from specified branch to apply configuration to Fleet

inputs:
  working-directory:
    description: 'The working directory, which should be the root of the fleet-gitops repository.'
    default: './'
  fleet-branch:
    description: 'The branch of fleetdm/fleet to clone and build fleetctl from.'
    required: true
  dry-run-only:
    description: 'Whether to only run the fleetctl gitops commands in dry-run mode.'
    default: 'false'
  delete-other-fleets:
    description: 'Whether to delete other fleets in Fleet which are not part of the gitops config.'
    default: 'true'

runs:
  using: "composite"
  steps:
    - name: Clone fleet repository
      shell: bash
      run: git clone --branch ${{ inputs.fleet-branch }} --depth 1 https://github.com/fleetdm/fleet.git /tmp/fleet

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: /tmp/fleet/go.mod

    - name: Build fleetctl
      shell: bash
      working-directory: /tmp/fleet
      run: |
        make fleetctl
        echo "/tmp/fleet/build" >> "$GITHUB_PATH"

    - name: Configure fleetctl
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # Build optional custom request headers from FLEET_CUSTOM_HEADERS, a comma-separated
        # list of "Header:Value" pairs. fleetctl persists them and sends them on every request,
        # so the gitops commands below use them too.
        CUSTOM_HEADER_ARGS=()
        if [[ -n "${FLEET_CUSTOM_HEADERS:-}" ]]; then
          IFS=',' read -ra _CUSTOM_HEADERS <<< "$FLEET_CUSTOM_HEADERS"
          for _header in "${_CUSTOM_HEADERS[@]}"; do
            CUSTOM_HEADER_ARGS+=(--custom-header "$_header")
          done
        fi
        fleetctl config set --address "$FLEET_URL" --token "$FLEET_API_TOKEN" "${CUSTOM_HEADER_ARGS[@]}"

    - name: Run fleetctl gitops commands
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        FLEET_DRY_RUN_ONLY: ${{ inputs.dry-run-only }}
        FLEET_DELETE_OTHER_FLEETS: ${{ inputs.delete-other-fleets }}
      run: ./gitops-fleets.sh
